<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能硬件组 — 工程平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1d1d1f; }
    .nav { display: flex; align-items: center; padding: 0 24px; height: 52px; background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid #e4e4e8; gap: 32px; }
    .nav-logo { font-weight: 700; font-size: 17px; color: #1d1d1f; }
    .nav-tabs { display: flex; gap: 0; }
    .nav-tabs a { text-decoration: none; color: #6e6e73; font-size: 14px; padding: 14px 18px; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; }
    .nav-tabs a:hover { color: #1d1d1f; }
    .nav-tabs a.active { color: #0071e3; border-bottom-color: #0071e3; font-weight: 600; }
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .section-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .card { background: #fff; border: 1px solid #e4e4e8; border-radius: 14px; padding: 52px 22px; min-height: 130px; transition: border-color .2s, box-shadow .2s; position: relative; cursor: pointer; text-decoration: none; color: inherit; display: block; }
    .card:hover { border-color: #0071e3; box-shadow: 0 4px 16px rgba(0,113,227,.08); }
    .card-icon { font-size: 32px; margin-bottom: 12px; }
    .card-tag { display: inline-block; font-size: 11px; color: #0071e3; background: rgba(0,113,227,.08); padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
    .card-title { font-size: 16px; font-weight: 650; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #6e6e73; line-height: 1.5; }
    .card-arrow { font-size: 12px; color: #0071e3; font-weight: 600; margin-top: 12px; }
    .footer { text-align: center; padding: 24px; color: #9a9aa0; font-size: 12px; }
    @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="nav">
    <span class="nav-logo">🚗 车身外饰</span>
    <div class="nav-tabs">
      <a class="tab" href="/">主页</a>
      <a class="tab" href="/body/">车身结构</a>
      <a class="tab" href="/exterior/">外饰</a>
      <a class="tab" href="/closure/">开闭件</a>
      <a class="tab active" href="/smart/">智能硬件</a>
    </div>
  </div>

  <div class="container">
    <h2 class="section-title">🔬 智能硬件组</h2>

    <div class="cards" id="module-cards">
      <a class="card" href="/mirro-fov/">
        <div class="card-icon">🪞</div>
        <span class="card-tag">法规校核</span>
        <div class="card-title">内外后视镜视野校核</div>
        <div class="card-desc">GB 15084 I/III 类 · 五线法 + 球面双眼交集 · 3DE 数据接入</div>
        <div class="card-arrow">进入 →</div>
      </a>
    </div>

    <div style="margin-top:32px;padding:16px 20px;background:#fff;border:1px solid #e4e4e8;border-radius:12px">
      <p style="font-size:13px;color:#6e6e73;line-height:1.6">
        <strong>📋 说明</strong><br>
        本页为智能硬件组模块入口。各模块独立开发维护，改完后将整个 smart/ 文件夹发给管理员替换即可上线。<br>
        模块开发规范见飞书文档。
      </p>
    </div>
  </div>

  <div class="footer">车身外饰部 · 工程平台</div>

  <script src="/ai-widget.js"></script>
</body>
</html>
